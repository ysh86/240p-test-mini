#
# Linker script for FDS (Famicom Disk System) port of 240pee
# Derived from sgrom512kbit.cfg (MMC1, CHR RAM); same segment layout,
# relocated into the FDS PRG RAM window:
#   switchable 16K bank -> $6000-$9FFF (was $8000-$BFFF)
#   fixed 16K bank      -> $A000-$DFFF (was $C000-$FFFF)
# Segment order in the fixed bank guarantees the DMC segment lands at
# $C000 or above (the 2A03 DMC can only fetch samples from $C000-$FFFF).
# The top 10 bytes of PRG RAM ($DFF6-$DFFF) are reserved for the FDS
# BIOS vector table and are not part of any loadable segment.
#
MEMORY {
  ZP:      start = $10,   size = $f0,   type = rw;
  RAM:     start = $0300, size = $0500, type = rw;
  ROM00:   start = $6000, size = $4000, type = ro, file = "bank0.bin", fill = yes, fillval = $FF, bank = 0;
  ROM01:   start = $6000, size = $4000, type = ro, file = "bank1.bin", fill = yes, fillval = $FF, bank = 1;
  ROM02:   start = $6000, size = $4000, type = ro, file = "bank2.bin", fill = yes, fillval = $FF, bank = 2;
  ROM15:   start = $A000, size = $3FF6, type = ro, file = "fixed.bin", fill = yes, fillval = $FF, bank = 2;
}

SEGMENTS {
  ZEROPAGE:   load = ZP, type = zp;
  BSS:        load = RAM, type = bss, define = yes, align = $100;

  BANK00:     load = ROM00, type = ro, align = $100, optional = yes;
  BANK01:     load = ROM01, type = ro, align = $100, optional = yes;
  GATEDATA:   load = ROM01, type = ro, optional = yes;
  CODE02:     load = ROM02, type = ro, align = $40;
  HELPDATA:   load = ROM02, type = ro, optional = yes;

  # Fixed bank: order matters.  LIBDATA+LIBCODE+CODE total more than
  # $2000 bytes, so the DMC segment (align 64) lands above $C000.
  LIBDATA:    load = ROM15, type = ro, align = $100, optional = yes;
  LIBCODE:    load = ROM15, type = ro, align = $80, optional = yes;
  CODE:       load = ROM15, type = ro, align = $40, optional = yes;
  DMC:        load = ROM15, type = ro, align = 64, optional = yes;
  RODATA:     load = ROM15, type = ro, align = $10;
  PB53CODE:   load = ROM15, type = ro, optional = yes;
  PB53TABLES: load = ROM15, type = ro, optional = yes;
}

FILES {
  "bank0.bin": format = bin;
  "bank1.bin": format = bin;
  "bank2.bin": format = bin;
  "fixed.bin": format = bin;
}
